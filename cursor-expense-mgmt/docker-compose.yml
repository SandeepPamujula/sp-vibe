services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense123
      POSTGRES_DB: expense_mgmt
    ports:
      - "5433:5432"
    volumes:
      - expense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_mgmt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  expense_pgdata:
    driver: local

